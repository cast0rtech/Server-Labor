version: '3.8'

services:
  influxdb:
    image: influxdb:2.7
    container_name: redlab-influxdb
    ports:
      - "4000:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER:-redlab}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-redlab_change_me}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-red_lab}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-iperf_stats}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-lab_token_secure}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: redlab-grafana
    depends_on:
      - influxdb
    ports:
      - "7500:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin_change_me}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: always

  iperf3:
    image: networkstatic/iperf3
    container_name: redlab-iperf3
    command: ["-s", "-p", "5201"]
    ports:
      - "5201:5201/tcp"
      - "5201:5201/udp"
    restart: always

  redlab-server:
    build:
      context: ..
      dockerfile: rpi/Dockerfile
    container_name: redlab-server
    network_mode: "host"
    environment:
      - PORT=8000
      - INFLUX_PORT=4000
      - GRAFANA_PORT=7500
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../.env:/app/.env
    restart: always

volumes:
  influxdb_data:
  influxdb_config:
  grafana_data:

