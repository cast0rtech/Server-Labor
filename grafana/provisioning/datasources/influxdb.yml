apiVersion: 1

datasources:
  - name: InfluxDB-RedLab
    uid: redlab-influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: red_lab
      defaultBucket: iperf_stats
      tlsSkipVerify: false
    secureJsonData:
      token: lab_token_secure
